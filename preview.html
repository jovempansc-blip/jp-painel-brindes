<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Painel de Operação e Programação — Jovem Pan Floripa</title>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script>
<style>
:root{
  --ink:#171c26;
  --muted:#657084;
  --line:#dfe5ec;
  --soft:#f5f7fa;
  --panel:rgba(255,255,255,.90);
  --wine:#b90d2f;
  --wine-soft:#fff1f4;
  --green:#137947;
  --green-soft:#effaf4;
  --orange:#b76400;
  --orange-soft:#fff6e9;
  --blue:#2567b7;
  --blue-soft:#eef5ff;
  --red:#b61c32;
  --red-soft:#fff1f3;
  --shadow:0 12px 34px rgba(18,25,38,.07);
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  color:var(--ink);
  background:
    linear-gradient(135deg,rgba(222,228,235,.38) 1px,transparent 1px) 0 0/48px 48px,
    linear-gradient(45deg,rgba(222,228,235,.20) 1px,transparent 1px) 0 0/48px 48px,
    #f6f8fb;
  font-family:"Segoe UI",Arial,sans-serif;
  font-weight:700;
}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{width:min(1480px,100%);margin:0 auto;padding:18px}
.executiveHeader{
  display:grid;
  grid-template-columns:minmax(310px,.95fr) minmax(420px,1.25fr) minmax(360px,1fr);
  align-items:center;
  gap:18px;
  padding:14px 18px;
  border:1px solid rgba(223,229,236,.96);
  border-radius:24px;
  background:rgba(255,255,255,.90);
  box-shadow:var(--shadow);
  backdrop-filter:blur(10px);
}
.brandBlock{display:flex;align-items:center;gap:15px;min-width:0}
.brandLogo{width:220px;max-height:52px;object-fit:contain;display:block}
.brandFallback{display:none;font-weight:1000;letter-spacing:.08em;color:#4d5562}
.brandCopy{min-width:0;border-left:1px solid var(--line);padding-left:14px}
.brandCopy h1{margin:0;font-size:22px;line-height:1.05;letter-spacing:-.04em}
.brandCopy p{margin:5px 0 0;color:var(--muted);font-size:9px;letter-spacing:.055em}
.headerFilters{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  min-width:0;
}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:7.5px;color:var(--muted);letter-spacing:.09em;font-weight:1000}
.control{
  width:100%;
  min-width:0;
  height:38px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:var(--ink);
  padding:0 10px;
  font-size:10px;
  font-weight:1000;
  text-transform:uppercase;
  outline:none;
}
.control:focus{border-color:#d89cac;box-shadow:0 0 0 3px rgba(185,13,47,.07)}
.syncBlock{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0}
.syncBadge{
  display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 11px;
  border:1px solid #bde9ce;border-radius:999px;background:var(--green-soft);color:var(--green);
  font-size:8.5px;font-weight:1000;letter-spacing:.05em;white-space:nowrap;
}
.syncBadge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px rgba(19,121,71,.08)}
.syncBadge.offline{border-color:#ffd7a8;background:var(--orange-soft);color:var(--orange)}
.updated{color:var(--muted);font-size:8.5px;line-height:1.3;text-align:right}
.tabs{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  margin:12px 0;padding:4px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.78);
}
.tab{
  appearance:none;border:1px solid transparent;border-radius:12px;background:transparent;color:#5f6876;
  min-height:34px;padding:0 13px;font-size:9px;font-weight:1000;letter-spacing:.035em;
}
.tab.active{background:linear-gradient(180deg,#c90b34,#ad0e2c);border-color:#ad0e2c;color:#fff;box-shadow:0 7px 16px rgba(185,13,47,.14)}
.view{display:none}.view.active{display:block}
.kpiGrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:10px}
.kpi{
  min-height:96px;padding:13px;border:1px solid var(--line);border-radius:18px;background:var(--panel);
  box-shadow:0 8px 22px rgba(18,25,38,.045);display:grid;align-content:space-between;gap:8px;
}
.kpi span{color:var(--muted);font-size:8px;letter-spacing:.07em;font-weight:1000}
.kpi strong{font-size:27px;line-height:1;letter-spacing:-.05em}
.kpi small{color:var(--muted);font-size:8px;line-height:1.25}
.kpi.alert{border-color:#ffd7a8;background:linear-gradient(180deg,#fff,#fff8ef)}
.kpi.danger{border-color:#f3b5c0;background:linear-gradient(180deg,#fff,#fff3f5)}
.kpi.ok{border-color:#bde9ce;background:linear-gradient(180deg,#fff,#f2fbf6)}
.dashboardGrid{display:grid;grid-template-columns:1.1fr .9fr;gap:10px}
.panel{
  border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 9px 24px rgba(18,25,38,.045);overflow:hidden;
}
.panelHead{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--line);background:rgba(248,250,252,.82);
}
.panelHead h2{margin:0;font-size:14px;letter-spacing:-.025em}
.panelHead span{color:var(--muted);font-size:8px;letter-spacing:.05em}
.panelBody{padding:12px}
.nowGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.nowCard{
  min-height:126px;padding:13px;border:1px solid var(--line);border-radius:17px;background:#fff;display:grid;gap:9px;
}
.nowCard .station{font-size:8px;color:var(--muted);letter-spacing:.07em}
.nowCard .time{font-size:31px;color:#a9475b;line-height:1;font-weight:1000;letter-spacing:-.06em}
.nowCard strong{font-size:15px;line-height:1.15}
.nowCard p{margin:0;color:var(--muted);font-size:9px;line-height:1.4}
.alertList,.list{display:grid;gap:8px}
.alertItem,.listItem{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;
  padding:10px 11px;border:1px solid var(--line);border-radius:14px;background:#fff;
}
.alertDot{width:9px;height:9px;border-radius:50%;background:#f2a13b;box-shadow:0 0 0 4px rgba(242,161,59,.10)}
.alertDot.red{background:#cf3d55;box-shadow:0 0 0 4px rgba(207,61,85,.10)}
.alertDot.green{background:#2f9a66;box-shadow:0 0 0 4px rgba(47,154,102,.10)}
.alertItem strong,.listItem strong{display:block;font-size:10.5px;line-height:1.2}
.alertItem span,.listItem span{display:block;margin-top:3px;color:var(--muted);font-size:8.5px;line-height:1.35}
.empty{padding:28px;text-align:center;border:1px dashed #ccd5df;border-radius:16px;color:#7b8492;font-size:9px;background:rgba(248,250,252,.65)}
.badge{
  display:inline-flex;align-items:center;justify-content:center;min-height:23px;padding:0 8px;border-radius:999px;
  border:1px solid var(--line);background:#f8fafc;color:#5f6876;font-size:7.5px;font-weight:1000;letter-spacing:.045em;white-space:nowrap;
}
.badge.noar{background:var(--green-soft);border-color:#bde9ce;color:var(--green)}
.badge.pendente{background:var(--orange-soft);border-color:#ffd7a8;color:var(--orange)}
.badge.cancelado{background:var(--red-soft);border-color:#f3b5c0;color:var(--red)}
.badge.realizado{background:var(--blue-soft);border-color:#cfe0ff;color:var(--blue)}
.badge.merchan{background:#edf7ff;border-color:#b9dcff;color:#1767ad}
.badge.promo{background:#fff4e6;border-color:#f0bf7a;color:#b85f00}
.badge.pauta{background:#f3f0ff;border-color:#d9d0ff;color:#654bb0}
.badge.aviso{background:#f4f6f8;border-color:#dce2e8;color:#5d6673}
.tableWrap{overflow:auto}
.table{width:100%;border-collapse:separate;border-spacing:0;min-width:920px}
.table th,.table td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.table th{position:sticky;top:0;background:#f8fafc;color:#657084;font-size:7.5px;letter-spacing:.075em;font-weight:1000;z-index:1}
.table td{font-size:9px}
.table tbody tr:last-child td{border-bottom:0}
.table td.num,.table th.num{text-align:center}
.table .primary{font-size:10.5px;font-weight:1000;color:var(--ink)}
.table .secondary{margin-top:3px;color:var(--muted);font-size:8px;line-height:1.3}
.timeCell{font-size:20px!important;font-weight:1000;color:#a9475b;letter-spacing:-.045em;white-space:nowrap}
.detailsRow td{background:#fbfcfe;padding:8px 12px}
.reservationList{display:flex;gap:6px;flex-wrap:wrap}
.reservationChip{
  display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:999px;
  border:1px solid #ecd2d9;background:#fff7f9;color:#8f2940;font-size:7.5px;font-weight:900;
}
.sectionToolbar{
  display:flex;align-items:end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;
}
.toolbarTitle h2{margin:0;font-size:17px;letter-spacing:-.035em}
.toolbarTitle p{margin:4px 0 0;color:var(--muted);font-size:8.5px}
.toolbarStats{display:flex;gap:6px;flex-wrap:wrap}
.statusSummary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.statusBox{padding:10px;border:1px solid var(--line);border-radius:14px;background:#fff}
.statusBox span{font-size:7.5px;color:var(--muted);letter-spacing:.06em}
.statusBox strong{display:block;margin-top:5px;font-size:19px}
.readStatus{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.deadline.today{background:var(--red-soft);border-color:#f3b5c0;color:var(--red)}
.deadline.tomorrow{background:var(--orange-soft);border-color:#ffd7a8;color:var(--orange)}
.deadline.ok{background:var(--blue-soft);border-color:#cfe0ff;color:var(--blue)}
.deadline.done{background:var(--green-soft);border-color:#bde9ce;color:var(--green)}
.deadline.expired{background:var(--red-soft);border-color:#f3b5c0;color:var(--red)}
@media(max-width:1200px){
  .executiveHeader{grid-template-columns:1fr 1fr}
  .syncBlock{grid-column:1/-1;justify-content:flex-start}
  .kpiGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:850px){
  .wrap{padding:10px}
  .executiveHeader{grid-template-columns:1fr}
  .headerFilters{grid-template-columns:1fr 1fr}
  .dashboardGrid,.nowGrid{grid-template-columns:1fr}
  .kpiGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .statusSummary{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){
  .brandBlock{align-items:flex-start;flex-direction:column}
  .brandCopy{border-left:0;padding-left:0}
  .headerFilters{grid-template-columns:1fr}
  .kpiGrid{grid-template-columns:1fr}
  .syncBlock{align-items:flex-start;flex-direction:column}
  .updated{text-align:left}
}

/* === V44: CABEÇALHO COM MAIS RESPIRO === */
.executiveHeader{
  grid-template-columns:minmax(0,1fr) auto!important;
  grid-template-areas:
    "brand sync"
    "filters filters"!important;
  gap:13px 22px!important;
  padding:16px 20px!important;
}
.brandBlock{
  grid-area:brand;
  gap:18px!important;
  min-width:0;
}
.brandLogo{
  width:245px!important;
  max-height:56px!important;
}
.brandCopy{
  padding-left:18px!important;
  min-width:0;
}
.brandCopy h1{
  max-width:520px;
  font-size:21px!important;
  line-height:1.08!important;
  letter-spacing:-.035em!important;
  white-space:normal;
}
.brandCopy p{
  display:none!important;
}
.headerFilters{
  grid-area:filters;
  width:min(760px,100%);
  grid-template-columns:repeat(3,minmax(180px,1fr))!important;
  gap:10px!important;
  justify-self:center;
}
.field{
  gap:5px!important;
}
.field label{
  font-size:8px!important;
}
.control{
  height:40px!important;
  font-size:10.5px!important;
  padding:0 12px!important;
}
.syncBlock{
  grid-area:sync;
  justify-content:flex-end!important;
  align-self:center;
}
.syncBadge{
  min-height:30px!important;
  padding:0 10px!important;
}
.updated{
  max-width:220px;
  line-height:1.25!important;
}
@media(max-width:1080px){
  .executiveHeader{
    grid-template-columns:1fr!important;
    grid-template-areas:
      "brand"
      "filters"
      "sync"!important;
  }
  .syncBlock{
    justify-content:flex-start!important;
  }
  .headerFilters{
    justify-self:stretch;
  }
}
@media(max-width:680px){
  .brandBlock{
    flex-direction:column;
    align-items:flex-start!important;
  }
  .brandCopy{
    border-left:0!important;
    padding-left:0!important;
  }
  .brandLogo{
    width:min(290px,100%)!important;
  }
  .headerFilters{
    grid-template-columns:1fr!important;
  }
  .syncBlock{
    align-items:flex-start;
    flex-direction:column;
  }
  .updated{
    text-align:left!important;
  }
}


/* === V45: LOGO E TÍTULO CENTRALIZADOS + FILTROS COMPACTOS === */
.executiveHeader{
  grid-template-columns:1fr!important;
  grid-template-areas:
    "brand"
    "filters"
    "sync"!important;
  justify-items:center!important;
  gap:10px!important;
  padding:15px 18px 13px!important;
}
.brandBlock{
  grid-area:brand;
  width:100%!important;
  justify-content:center!important;
  align-items:center!important;
  gap:18px!important;
  text-align:center!important;
}
.brandLogo{
  width:255px!important;
  max-height:58px!important;
}
.brandCopy{
  border-left:1px solid var(--line)!important;
  padding-left:18px!important;
  min-width:0!important;
}
.brandCopy h1{
  max-width:none!important;
  margin:0!important;
  font-size:23px!important;
  line-height:1.05!important;
  text-align:center!important;
  white-space:nowrap!important;
}
.headerFilters{
  grid-area:filters;
  width:min(620px,100%)!important;
  grid-template-columns:repeat(3,minmax(150px,1fr))!important;
  gap:8px!important;
  justify-self:center!important;
}
.field{
  gap:4px!important;
}
.field label{
  font-size:7.2px!important;
  text-align:left!important;
}
.control{
  height:34px!important;
  min-height:34px!important;
  border-radius:11px!important;
  padding:0 10px!important;
  font-size:9.5px!important;
}
.syncBlock{
  grid-area:sync;
  width:min(620px,100%)!important;
  display:flex!important;
  justify-content:center!important;
  align-items:center!important;
  gap:10px!important;
}
.syncBadge{
  min-height:27px!important;
  padding:0 9px!important;
  font-size:7.6px!important;
}
.updated{
  max-width:none!important;
  font-size:7.8px!important;
  text-align:center!important;
  white-space:nowrap!important;
}
@media(max-width:860px){
  .brandBlock{
    flex-direction:column!important;
    gap:10px!important;
  }
  .brandCopy{
    border-left:0!important;
    padding-left:0!important;
  }
  .brandCopy h1{
    white-space:normal!important;
  }
}
@media(max-width:620px){
  .headerFilters{
    grid-template-columns:1fr!important;
    width:100%!important;
  }
  .syncBlock{
    flex-direction:column!important;
  }
  .updated{
    white-space:normal!important;
  }
}


/* === V46: VISÃO GERAL SEM O BLOCO ALERTAS DA DIREÇÃO === */
.dashboardGrid{
  grid-template-columns:1fr!important;
}
.dashboardGrid>.panel{
  width:100%!important;
}

</style>
<style>

/* =========================================================
   UX14 — PADRÃO ESTRUTURAL APROVADO
   Ajustes visuais transversais: compactos, responsivos e
   sem alteração das regras funcionais do Workspace.
   ========================================================= */
:root{--ux-ok:#0f7a46;--ux-warn:#a46200;--ux-danger:#ad1728;--ux-info:#2f69c9;--ux-neutral:#69707d}
button,.btn,.modalBtn,.pickupBtn{max-width:100%}
button:focus-visible,.btn:focus-visible,.modalBtn:focus-visible,.actionIcon:focus-visible,.tabBtn:focus-visible{outline:3px solid rgba(47,105,201,.22)!important;outline-offset:2px!important}
button:disabled,.btn:disabled,.modalBtn:disabled{cursor:not-allowed!important;opacity:.52!important;transform:none!important}
.tableWrap{overscroll-behavior:contain;scrollbar-gutter:stable}
table th{white-space:nowrap}
tbody tr{transition:background .14s ease,box-shadow .14s ease}
tbody tr:focus-within td{background:#fff8fa}
.badge,.status,.result,.deadlineNote{font-variant-numeric:tabular-nums}
.empty{border:1px dashed #dfe4ec;border-radius:12px;background:#fafbfd;line-height:1.45}
.drawerHead,.modalCard>h2:first-child,.modalCard>h3:first-child{position:sticky;top:0;z-index:4}
.formActions,.modalActions{position:sticky;bottom:0;z-index:4;background:linear-gradient(180deg,rgba(255,255,255,.88),#fff 32%);padding-top:9px}
.control[aria-invalid="true"],input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--ux-danger)!important;box-shadow:0 0 0 3px rgba(173,23,40,.08)!important}
.uxFieldError{display:block;margin-top:4px;color:var(--ux-danger);font-size:9px;font-weight:900;letter-spacing:.035em}
.uxStatusDot{display:inline-block;width:7px;height:7px;border-radius:999px;margin-right:5px;background:currentColor;vertical-align:1px}
.uxContextBar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 10px;padding:7px 9px;border:1px solid #e5e9ef;border-radius:12px;background:rgba(255,255,255,.86);color:#5f6978;font-size:9px;font-weight:900;letter-spacing:.045em}
.uxContextBar strong{color:#171c26;font-size:10px}.uxContextSep{color:#c3c9d2}.uxSyncOk{color:var(--ux-ok)}
.uxReadOnly [data-edit-only="true"]{display:none!important}
@media(max-width:900px){table{min-width:860px}.tableWrap{border-radius:14px!important}.uxContextBar{margin-bottom:8px}.formActions,.modalActions{padding-bottom:max(4px,env(safe-area-inset-bottom))}}
@media(max-width:640px){button,.btn,.modalBtn,.pickupBtn{min-height:32px!important}.actionIcon{min-width:27px!important;min-height:27px!important}.badge{white-space:normal!important;text-align:center}.drawer,.modalBackdrop{padding:8px!important}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}

</style>

<style id="r18-direction-css">

.successEmpty{border-color:#bde9ce!important;background:#f2fbf6!important;color:#137947!important}
.alertButton{width:100%;font-family:inherit;text-align:left}.alertButton:hover{border-color:#d4a2ad;background:#fffafb}.alertCopy{min-width:0}.alertCopy>span{display:block;margin-top:3px;color:var(--muted);font-size:8.5px}.kpiButton{appearance:none;width:100%;text-align:left;color:inherit;cursor:pointer}.kpiButton:hover{border-color:#d6a5af;transform:translateY(-1px)}
.drillContext{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;padding:9px 11px;border:1px solid #d8dfe8;border-radius:13px;background:#fff;font-size:9px;color:var(--muted)}.drillContext strong{color:var(--ink)}
.drillTarget{box-shadow:inset 3px 0 0 var(--wine);background:#fff9fb!important}

      const tm=String(key).match(/-(\d{2})(\d{2})$/),time=tm?`${tm[1]}:${tm[2]}`:timeToHHMM(promo.resultSlot||promo.drawTime||"");
      normalizedWinnerList(list).forEach((row,index)=>all.push({...row,pickupBusinessDays:Math.max(1,Math.min(5,Number(row.pickupBusinessDays)||Number(promo.pickupBusinessDays)||5)),occurrenceKey:key,occurrenceDate:date,occurrenceTime:time,winnerIndex:index}));
    });

  }
  const base=normalizedWinnerList(promo.resultWinners);

function promoWinners(promo){const seen=new Set();return promoWinnerOccurrences(promo).filter(row=>{if(seen.has(row.name))return false;seen.add(row.name);return true;});}
function mergePromoData(base,copy){
  const newer=(Date.parse(copy.updatedAt||copy.createdAt||0)||0)>(Date.parse(base.updatedAt||base.createdAt||0)||0);
  const merged=newer?{...base,...copy}:{...copy,...base};
  merged.readByHour={...(base.readByHour||{}),...(copy.readByHour||{})};
  merged.resultWinnersByHour={...(base.resultWinnersByHour||{}),...(copy.resultWinnersByHour||{})};
  const logs=[...(base.readLog||[]),...(copy.readLog||[])],seen=new Set();
  merged.readLog=logs.filter(log=>{const key=log?.id||`${log?.key||''}|${log?.confirmedAt||log?.readAt||''}`;if(!key||seen.has(key))return false;seen.add(key);return true;});
  return merged;
}
function allPromos(){
  const map=new Map();
  Object.entries(state.months||{}).forEach(([month,m])=>(m.promos||[]).forEach(p=>{
    const id=p.id||`${month}|${promoKind(p)}|${promoTitle(p)}|${p.station||'ALL'}|${p.program||''}`;
    map.set(id,map.has(id)?mergePromoData(map.get(id),p):{...p,__sourceMonth:month});
  }));
  return [...map.values()];
}
function promosForMonth(monthKey=currentMonth){return allPromos().filter(p=>{const start=promoStart(p)||`${monthKey}-01`,end=promoEnd(p)||monthLastDay(monthKey);return start<=monthLastDay(monthKey)&&end>=`${monthKey}-01`;});}
function readKeys(date,slot){const hhmm=timeToHHMM(slot),compact=hhmm.replace(":",""),hour=hhmm.slice(0,2),minute=hhmm.slice(3,5),keys=[`${date}-${compact}`];if(minute==="00")keys.push(`${date}-${hour}`);return keys;}
function rawReadValue(promo,date,slot){for(const key of readKeys(date,slot)){if(Object.prototype.hasOwnProperty.call(promo.readByHour||{},key))return promo.readByHour[key];}return "";}
function validReadTimestamp(value){if(!value)return"";if(typeof value==='object')value=value.confirmedAt||value.readAt||value.at||value.iso||value.value||'';if(typeof value!=='string')return"";const d=new Date(value);return Number.isNaN(d.getTime())?"":value;}
function readInfo(promo,date,slot){
  const keys=readKeys(date,slot);let raw=rawReadValue(promo,date,slot),timestamp=validReadTimestamp(raw),incomplete=!!raw&&!timestamp;
  if(!timestamp){const logs=[...(promo.readLog||[])].reverse();const match=logs.find(log=>{if(!log)return false;if(log.key&&keys.includes(log.key))return true;const sameDate=!log.date||log.date===date;const sameSlot=!log.slot||timeToHHMM(log.slot)===timeToHHMM(slot);const sameStation=!log.station||stationCode(log.station)===stationCode(promo.station);return sameDate&&sameSlot&&sameStation;});timestamp=validReadTimestamp(match?.confirmedAt||match?.readAt||'');if(!timestamp&&match)incomplete=true;}
  return{timestamp,incomplete};
}
function readValue(promo,date,slot){return readInfo(promo,date,slot).timestamp||rawReadValue(promo,date,slot);}
function programScheduleRows(station,program=''){return (state.programSchedules||[]).filter(row=>stationCode(row.station||'JP1017')===stationCode(station)&&(!program||upper(row.name)===upper(program)));}
function dayIndex(date){const [y,m,d]=String(date).split('-').map(Number);return new Date(y,m-1,d).getDay();}
function minutesOf(value){const match=String(value||'00:00').match(/(\d{1,2}):(\d{2})/);return match?Number(match[1])*60+Number(match[2]):0;}
function programAllowedOnDate(promo,date){const rows=programScheduleRows(promo.station||'JP1017',promo.program||'');if(!rows.length)return true;const day=dayIndex(date);return rows.some(row=>(Array.isArray(row.days)?row.days.map(Number):[1,2,3,4,5]).includes(day));}
function slotAllowedOnDate(station,program,date,slot){const rows=programScheduleRows(station,program);if(!rows.length)return true;const minute=slotMinutes(slot),day=dayIndex(date);return rows.some(row=>{const days=Array.isArray(row.days)?row.days.map(Number):[1,2,3,4,5];return days.includes(day)&&minute>=Math.ceil(minutesOf(row.startTime)/60)*60&&minute<minutesOf(row.endTime);});}
function gradeMissing(promo){return !!promo.program&&!programScheduleRows(promo.station||'JP1017',promo.program).length;}
function rotationGroupKey(promo){return upper(promo.rotationGroupId||`${stationCode(promo.station)}|${promo.program||''}|${promoReadHours(promo).join(',')}`);}

function rotationAssignedPromo(promo,date,slot){
  const peers=rotationPeers(promo,date);if(peers.length<=1)return promo;
  const confirmed=peers.find(peer=>readInfo(peer,date,slot).timestamp);if(confirmed)return confirmed;
  const hours=promoReadHours(promo),slotIndex=Math.max(0,hours.findIndex(h=>timeToHHMM(h)===timeToHHMM(slot)));
  const epoch='2020-01-01',daySerial=daysBetween(epoch,date);
  return peers[((daySerial+slotIndex)%peers.length+peers.length)%peers.length];

function occurrenceState(date,slot,grace=READ_GRACE_MINUTES){
  const today=liveTodayISO();if(date<today)return"NÃO CONFIRMADA";if(date>today)return"PROGRAMADO";
  const delta=nowMinutes()-slotMinutes(slot);if(delta<0)return"PROGRAMADO";if(delta<=grace)return"AGORA";return"NÃO CONFIRMADA";

function expectedReadRowsForPromo(promo,start=promoStart(promo),end=promoEnd(promo)){
  if(!start||!end||end<start)return[];
  const hours=promoReadHours(promo),rows=[];
  dateRange(start,end).forEach(date=>{
    if(!programAllowedOnDate(promo,date))return;

function resultOperationalStatus(promo,date){

function reportDateRange(){const base=currentMonth||liveTodayISO().slice(0,7),last=monthLastDay(base);if(!reportFrom)reportFrom=`${base}-01`;if(!reportTo)reportTo=last;if(reportTo<reportFrom)[reportFrom,reportTo]=[reportTo,reportFrom];return{from:reportFrom,to:reportTo};}
