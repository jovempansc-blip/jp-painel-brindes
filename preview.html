<style>
:root{
  --ink:#171c26;
  --muted:#657084;
  --line:#dfe5ec;
  --soft:#f5f7fa;
  --panel:rgba(255,255,255,.90);
  --wine:#b90d2f;
  --wine-soft:#fff1f4;
  --green:#137947;
  --green-soft:#effaf4;
  --orange:#b76400;
  --orange-soft:#fff6e9;
  --blue:#2567b7;
  --blue-soft:#eef5ff;
  --red:#b61c32;
  --red-soft:#fff1f3;
  --shadow:0 12px 34px rgba(18,25,38,.07);
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  color:var(--ink);
  background:
    linear-gradient(135deg,rgba(222,228,235,.38) 1px,transparent 1px) 0 0/48px 48px,
    linear-gradient(45deg,rgba(222,228,235,.20) 1px,transparent 1px) 0 0/48px 48px,
    #f6f8fb;
  font-family:"Segoe UI",Arial,sans-serif;
  font-weight:700;
}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{width:min(1480px,100%);margin:0 auto;padding:18px}
.executiveHeader{
  display:grid;
  grid-template-columns:minmax(310px,.95fr) minmax(420px,1.25fr) minmax(360px,1fr);
  align-items:center;
  gap:18px;
  padding:14px 18px;
  border:1px solid rgba(223,229,236,.96);
  border-radius:24px;
  background:rgba(255,255,255,.90);
  box-shadow:var(--shadow);
  backdrop-filter:blur(10px);
}
.brandBlock{display:flex;align-items:center;gap:15px;min-width:0}
.brandLogo{width:220px;max-height:52px;object-fit:contain;display:block}
.brandFallback{display:none;font-weight:1000;letter-spacing:.08em;color:#4d5562}
.brandCopy{min-width:0;border-left:1px solid var(--line);padding-left:14px}
.brandCopy h1{margin:0;font-size:22px;line-height:1.05;letter-spacing:-.04em}
.brandCopy p{margin:5px 0 0;color:var(--muted);font-size:9px;letter-spacing:.055em}
.headerFilters{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  min-width:0;
}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:7.5px;color:var(--muted);letter-spacing:.09em;font-weight:1000}
.control{
  width:100%;
  min-width:0;
  height:38px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:var(--ink);
  padding:0 10px;
  font-size:10px;
  font-weight:1000;
  text-transform:uppercase;
  outline:none;
}
.control:focus{border-color:#d89cac;box-shadow:0 0 0 3px rgba(185,13,47,.07)}
.syncBlock{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0}
.syncBadge{
  display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 11px;
  border:1px solid #bde9ce;border-radius:999px;background:var(--green-soft);color:var(--green);
  font-size:8.5px;font-weight:1000;letter-spacing:.05em;white-space:nowrap;
}
.syncBadge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px rgba(19,121,71,.08)}
.syncBadge.offline{border-color:#ffd7a8;background:var(--orange-soft);color:var(--orange)}

.syncBadge.connecting{border-color:#d8e2ef!important;background:#f5f8fc!important;color:#5f7188!important}
.syncBadge.connecting::before{animation:directionSyncPulse .9s ease-in-out infinite}
.syncBadge.error{border-color:#f0b5bf!important;background:#fff2f4!important;color:#a61e35!important}
@keyframes directionSyncPulse{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.18)}}
.updated{color:var(--muted);font-size:8.5px;line-height:1.3;text-align:right}
.tabs{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  margin:12px 0;padding:4px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.78);
}
.tab{
  appearance:none;border:1px solid transparent;border-radius:12px;background:transparent;color:#5f6876;
  min-height:34px;padding:0 13px;font-size:9px;font-weight:1000;letter-spacing:.035em;
}
.tab.active{background:linear-gradient(180deg,#c90b34,#ad0e2c);border-color:#ad0e2c;color:#fff;box-shadow:0 7px 16px rgba(185,13,47,.14)}
.view{display:none}.view.active{display:block}
.kpiGrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:10px}
.kpi{
  min-height:96px;padding:13px;border:1px solid var(--line);border-radius:18px;background:var(--panel);
  box-shadow:0 8px 22px rgba(18,25,38,.045);display:grid;align-content:space-between;gap:8px;
}
.kpi span{color:var(--muted);font-size:8px;letter-spacing:.07em;font-weight:1000}
.kpi strong{font-size:27px;line-height:1;letter-spacing:-.05em}
.kpi small{color:var(--muted);font-size:8px;line-height:1.25}
.kpi.alert{border-color:#ffd7a8;background:linear-gradient(180deg,#fff,#fff8ef)}
.kpi.danger{border-color:#f3b5c0;background:linear-gradient(180deg,#fff,#fff3f5)}
.kpi.ok{border-color:#bde9ce;background:linear-gradient(180deg,#fff,#f2fbf6)}
.dashboardGrid{display:grid;grid-template-columns:1.1fr .9fr;gap:10px}
.panel{
  border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 9px 24px rgba(18,25,38,.045);overflow:hidden;
}
.panelHead{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--line);background:rgba(248,250,252,.82);
}
.panelHead h2{margin:0;font-size:14px;letter-spacing:-.025em}
.panelHead span{color:var(--muted);font-size:8px;letter-spacing:.05em}
.panelBody{padding:12px}
.nowGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.nowCard{
  min-height:126px;padding:13px;border:1px solid var(--line);border-radius:17px;background:#fff;display:grid;gap:9px;
}
.nowCard .station{font-size:8px;color:var(--muted);letter-spacing:.07em}
.nowCard .time{font-size:31px;color:#a9475b;line-height:1;font-weight:1000;letter-spacing:-.06em}
.nowCard strong{font-size:15px;line-height:1.15}
.nowCard p{margin:0;color:var(--muted);font-size:9px;line-height:1.4}
.alertList,.list{display:grid;gap:8px}
.alertItem,.listItem{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;
  padding:10px 11px;border:1px solid var(--line);border-radius:14px;background:#fff;
}
.alertDot{width:9px;height:9px;border-radius:50%;background:#f2a13b;box-shadow:0 0 0 4px rgba(242,161,59,.10)}
.alertDot.red{background:#cf3d55;box-shadow:0 0 0 4px rgba(207,61,85,.10)}
.alertDot.green{background:#2f9a66;box-shadow:0 0 0 4px rgba(47,154,102,.10)}
.alertItem strong,.listItem strong{display:block;font-size:10.5px;line-height:1.2}
.alertItem span,.listItem span{display:block;margin-top:3px;color:var(--muted);font-size:8.5px;line-height:1.35}
.empty{padding:28px;text-align:center;border:1px dashed #ccd5df;border-radius:16px;color:#7b8492;font-size:9px;background:rgba(248,250,252,.65)}
.badge{
  display:inline-flex;align-items:center;justify-content:center;min-height:23px;padding:0 8px;border-radius:999px;
  border:1px solid var(--line);background:#f8fafc;color:#5f6876;font-size:7.5px;font-weight:1000;letter-spacing:.045em;white-space:nowrap;
}
.badge.noar{background:var(--green-soft);border-color:#bde9ce;color:var(--green)}
.badge.pendente{background:var(--orange-soft);border-color:#ffd7a8;color:var(--orange)}
.badge.cancelado{background:var(--red-soft);border-color:#f3b5c0;color:var(--red)}
.badge.realizado{background:var(--blue-soft);border-color:#cfe0ff;color:var(--blue)}
.badge.merchan{background:#edf7ff;border-color:#b9dcff;color:#1767ad}
.badge.promo{background:#fff4e6;border-color:#f0bf7a;color:#b85f00}
.badge.pauta{background:#f3f0ff;border-color:#d9d0ff;color:#654bb0}
.badge.aviso{background:#f4f6f8;border-color:#dce2e8;color:#5d6673}
.tableWrap{overflow:auto}
.table{width:100%;border-collapse:separate;border-spacing:0;min-width:920px}
.table th,.table td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.table th{position:sticky;top:0;background:#f8fafc;color:#657084;font-size:7.5px;letter-spacing:.075em;font-weight:1000;z-index:1}
.table td{font-size:9px}
.table tbody tr:last-child td{border-bottom:0}
.table td.num,.table th.num{text-align:center}
.table .primary{font-size:10.5px;font-weight:1000;color:var(--ink)}
.table .secondary{margin-top:3px;color:var(--muted);font-size:8px;line-height:1.3}
.pickupDeliveryDate{margin-top:5px!important;color:#08733d!important;font-size:8px!important;font-weight:1000!important;white-space:nowrap}
.timeCell{font-size:20px!important;font-weight:1000;color:#a9475b;letter-spacing:-.045em;white-space:nowrap}
/* AV-57.3 · DIREÇÃO: PROGRAMA VINCULADO À GRADE OFICIAL + ALINHAMENTO */
.programTable{min-width:1080px;table-layout:fixed}
.programTable th:nth-child(1),.programTable td:nth-child(1){width:90px}
.programTable th:nth-child(2),.programTable td:nth-child(2){width:145px}
.programTable th:nth-child(3),.programTable td:nth-child(3){width:230px}
.programTable th:nth-child(5),.programTable td:nth-child(5){width:115px}
.programTable th:nth-child(6),.programTable td:nth-child(6){width:190px}
.programTable .programCell .primary{font-size:10.5px;line-height:1.24;letter-spacing:-.01em;overflow-wrap:anywhere}
.programTable .stationCell .badge{min-width:92px}
.programTable .contentCell .primary,.programTable .winnerCell .primary{line-height:1.25}
.programTable .missingProgram{color:#a45a00}
.programTable .currentHourRow td{background:#fff8f9}
.programTable .currentHourRow .timeCell{box-shadow:inset 3px 0 0 #b90d2f}
.detailsRow td{background:#fbfcfe;padding:8px 12px}
.reservationList{display:flex;gap:6px;flex-wrap:wrap}
.reservationChip{
  display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:999px;
  border:1px solid #ecd2d9;background:#fff7f9;color:#8f2940;font-size:7.5px;font-weight:900;
}
.sectionToolbar{
  display:flex;align-items:end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;
}
.toolbarTitle h2{margin:0;font-size:17px;letter-spacing:-.035em}
.toolbarTitle p{margin:4px 0 0;color:var(--muted);font-size:8.5px}
.toolbarStats{display:flex;gap:6px;flex-wrap:wrap}
.statusSummary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.statusBox{padding:10px;border:1px solid var(--line);border-radius:14px;background:#fff}
.statusBox span{font-size:7.5px;color:var(--muted);letter-spacing:.06em}
.statusBox strong{display:block;margin-top:5px;font-size:19px}
.readStatus{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.deadline.today{background:var(--red-soft);border-color:#f3b5c0;color:var(--red)}
.deadline.tomorrow{background:var(--orange-soft);border-color:#ffd7a8;color:var(--orange)}
.deadline.ok{background:var(--blue-soft);border-color:#cfe0ff;color:var(--blue)}
.deadline.done{background:var(--green-soft);border-color:#bde9ce;color:var(--green)}
.deadline.expired{background:var(--red-soft);border-color:#f3b5c0;color:var(--red)}
@media(max-width:1200px){
  .executiveHeader{grid-template-columns:1fr 1fr}
  .syncBlock{grid-column:1/-1;justify-content:flex-start}
  .kpiGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:850px){

  .executiveHeader{grid-template-columns:1fr}
  .headerFilters{grid-template-columns:1fr 1fr}

  .kpiGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .statusSummary{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){
  .brandBlock{align-items:flex-start;flex-direction:column}
  .brandCopy{border-left:0;padding-left:0}

  .kpiGrid{grid-template-columns:1fr}
  .syncBlock{align-items:flex-start;flex-direction:column}
  .updated{text-align:left}
}

    firebaseConnected=false;directionShowConnecting('RECONECTANDO AUTOMATICAMENTE');directionScheduleFirebaseRetry(1600);
  },error=>{
    firebaseLastError=String(error?.message||error||'MONITOR DE CONEXÃO');
    if(!directionHasRecentServerActivity())directionShowConnecting('RECONECTANDO AUTOMATICAMENTE');
    directionScheduleFirebaseRetry(1800);
  });
  firebaseRef.on('value',snapshot=>{
    try{
      const value=snapshot.val();if(!value)throw new Error('BASE FIREBASE VAZIA');
      applyPayload(value,'firebase');
    }catch(error){
      firebaseLastError=String(error?.message||error||'ERRO AO PROCESSAR FIREBASE');
      console.warn('DIRECTION FIREBASE LISTENER APPLY ERROR',error);
      if(!directionHasRecentServerActivity())directionScheduleFirebaseRetry(2200);
    }
  },error=>{
    firebaseLastError=String(error?.message||error||'LISTENER FIREBASE');
    console.warn('DIRECTION FIREBASE LISTENER ERROR',error);
    if(!directionHasRecentServerActivity())directionShowConnecting('RECONECTANDO AUTOMATICAMENTE');
    directionScheduleFirebaseRetry(2000);
  });
}
async function directionFirebaseHealthCheck(){
  if(navigator.onLine===false)return false;
  try{
    if(firebaseReady&&firebaseRef){
      if(firebaseDatabase&&typeof firebaseDatabase.goOnline==='function')firebaseDatabase.goOnline();
      await Promise.race([firebaseRef.child('savedAt').get(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('TIMEOUT HEALTH SDK')),5000))]);
      directionMarkFirebaseActivity();return true;
    }
  }catch(error){firebaseLastError=String(error?.message||error||'HEALTH SDK');}
  try{
    const base=String(FIREBASE_CONFIG.databaseURL||'').replace(/\/$/,''),path=FIREBASE_ROOT_PATH.split('/').map(encodeURIComponent).join('/');
    const response=await Promise.race([fetch(`${base}/${path}/savedAt.json?_=${Date.now()}`,{method:'GET',cache:'no-store',mode:'cors',credentials:'omit'}),new Promise((_,reject)=>setTimeout(()=>reject(new Error('TIMEOUT HEALTH REST')),5000))]);
    if(!response.ok)throw new Error(`HEALTH REST HTTP ${response.status}`);
    directionMarkFirebaseActivity();return true;
  }catch(error){firebaseLastError=String(error?.message||error||'HEALTH REST');return false;}
}
function initDirectionFirebase(){
  if(firebaseReady){directionFirebaseBootstrap(false);return;}
  if(firebaseStarted)return;
  firebaseStarted=true;
  if(!directionFirebaseConfigReady()){
    directionShowConnecting('CARREGANDO FIREBASE');
    let attempts=0;
    const wait=()=>{
      if(directionFirebaseConfigReady()){firebaseStarted=false;initDirectionFirebase();return;}
      if(++attempts<30){setTimeout(wait,250);return;}
      firebaseStarted=false;
      firebaseLastError='SDK DO FIREBASE NÃO CARREGOU';
      if(!directionHasRecentServerActivity())updateConnection(false,firebaseLastError,'error');
      directionScheduleFirebaseRetry(3500);
    };
    setTimeout(wait,120);return;
  }
  try{
    const app=window.firebase.apps&&window.firebase.apps.length?window.firebase.app():window.firebase.initializeApp(FIREBASE_CONFIG);
    firebaseDatabase=window.firebase.database(app);
    if(firebaseDatabase&&typeof firebaseDatabase.goOnline==='function')firebaseDatabase.goOnline();
    firebaseRef=firebaseDatabase.ref(FIREBASE_ROOT_PATH);
    firebaseReady=true;
    directionShowConnecting('CONECTANDO AUTOMATICAMENTE');
    directionAttachFirebaseListeners();
    directionFirebaseBootstrap(true);
  }catch(error){
    firebaseStarted=false;firebaseReady=false;firebaseConnected=false;
    firebaseLastError=String(error?.message||error||'ERRO AO INICIALIZAR FIREBASE');
    console.warn('DIRECTION FIREBASE INIT ERROR',error);
    updateConnection(false,firebaseLastError,'error');
    directionScheduleFirebaseRetry(3000);
  }
}
function directionForceFirebaseConnect(force=false){
  if(navigator.onLine===false){firebaseConnected=false;updateConnection(false,'NAVEGADOR SEM INTERNET','local');return;}
  if(!firebaseReady){initDirectionFirebase();directionFirebaseRestRead(force);return;}
  try{if(firebaseDatabase&&typeof firebaseDatabase.goOnline==='function')firebaseDatabase.goOnline();}catch(error){console.warn('DIRECTION FIREBASE GOONLINE ERROR',error);}
  directionFirebaseBootstrap(force||!firebaseConnected||!firebaseServerLoaded||!directionHasRecentServerActivity());
}
function startDirectionFirebaseAutoConnect(){
  [0,600,1800,4500].forEach(delay=>setTimeout(()=>{
    if(firebaseConnected&&firebaseServerLoaded&&directionHasRecentServerActivity())return;
    directionForceFirebaseConnect(true);
  },delay));
}

directionInitUI();
// O painel fica operacional antes do SDK. A primeira leitura REST não depende do CDN do Firebase.
directionShowConnecting('CONECTANDO AUTOMATICAMENTE');
directionFirebaseRestRead(true).finally(()=>initDirectionFirebase());
startDirectionFirebaseAutoConnect();
setTimeout(()=>{if(!firebaseServerLoaded)loadLocalFallback();},3000);
setInterval(async()=>{
  if(navigator.onLine===false)return;
  if(directionHasRecentServerActivity(90000))return;
  const healthy=await directionFirebaseHealthCheck();
  if(!healthy)directionForceFirebaseConnect(true);
},30000);
window.addEventListener('online',()=>{if(!directionHasRecentServerActivity())directionShowConnecting('INTERNET RESTABELECIDA · RECONECTANDO');directionForceFirebaseConnect(true);});
window.addEventListener('offline',()=>{firebaseConnected=false;updateConnection(false,'NAVEGADOR SEM INTERNET','local');});
window.addEventListener('focus',()=>{if(!firebaseConnected||!firebaseServerLoaded||!directionHasRecentServerActivity(60000))directionForceFirebaseConnect(true);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(!firebaseConnected||!firebaseServerLoaded||!directionHasRecentServerActivity(60000)))directionForceFirebaseConnect(true);});

let lastLiveClockKey="",lastLiveDate=liveTodayISO();
function refreshTimeDependentViews(force=false){
  const now=liveNow(),key=`${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}-${now.getHours()}-${now.getMinutes()}`,today=liveTodayISO();if(!force&&key===lastLiveClockKey)return;lastLiveClockKey=key;
  if(today!==lastLiveDate){const selected=$("dateFilter")?.value||lastLiveDate;if(selected===lastLiveDate){$("dateFilter").value=today;setMonthFromDate(today);}lastLiveDate=today;}
  if(activeTab==='programacao')renderProgramacao();else if(activeTab==='promocoes')renderPromocoes();else if(activeTab==='retiradas')renderRetiradas();else if(activeTab==='relatorios')renderRelatorios();
}
setInterval(()=>refreshTimeDependentViews(false),1000);window.addEventListener("focus",()=>refreshTimeDependentViews(true));document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshTimeDependentViews(true);});
</script>
