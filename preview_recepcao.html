<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recepção — Conferência de Sorteios</title>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script>
<style>
:root{--ink:#171c26;--muted:#697386;--line:#dfe5ec;--green:#137947;--red:#d7324e;--bg:#f4f6fa;--studioBg:url("assets/bg-estudio.jpg")}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:linear-gradient(180deg,rgba(246,248,252,.90),rgba(245,247,251,.95)),var(--studioBg) center/cover fixed no-repeat;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);text-transform:uppercase;font-weight:900}
.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px;background:rgba(255,255,255,.72);border:1px solid rgba(223,229,236,.9);border-radius:22px;padding:14px 16px;box-shadow:0 10px 26px rgba(16,24,40,.045);backdrop-filter:blur(8px)}
.logoBar{width:min(560px,100%);display:flex;align-items:center;justify-content:center;padding:10px 18px;margin:0 auto 18px;border:1px solid rgba(223,229,236,.92);border-radius:20px;background:rgba(255,255,255,.86);box-shadow:0 10px 24px rgba(16,24,40,.055);backdrop-filter:blur(8px)}
.logoBar img{display:block;width:min(100%,460px);max-height:58px;height:auto;object-fit:contain}
.wrap{width:min(1180px,100%);margin:0 auto;padding:28px}

.brand{display:flex;align-items:center;gap:14px}
.brand h1{margin:0;font-size:25px;letter-spacing:-.04em}
.brand span{display:block;margin-top:4px;color:#ff8200;font-size:12px;letter-spacing:.05em}
.controls{display:flex;align-items:center;gap:10px}
input{height:44px;border:1px solid #dfe5ec;border-radius:14px;background:#fff;padding:0 13px;font-size:14px;font-weight:1000;color:#171c26;text-transform:uppercase}
.updated{color:#687385;font-size:11px}
.hero{display:grid;gap:18px;margin-bottom:18px}
.titleBox,.descBox{border:1px solid #dfe5ec;border-radius:22px;background:#fff;min-height:76px;display:grid;place-items:center;padding:18px 28px;box-shadow:0 10px 24px rgba(16,24,40,.04)}
.titleBox{box-shadow:inset 5px 0 0 #d7324e,0 10px 24px rgba(16,24,40,.04)}
.titleBox h2{margin:0;font-size:28px;letter-spacing:-.04em;text-align:center}
.descBox p{margin:0;color:#5f6a7a;font-size:15px;text-align:center}
.list{display:grid;gap:12px}
.resultCard{display:grid;grid-template-columns:105px minmax(0,1fr) auto;gap:16px;align-items:center;border:1px solid #dfe5ec;border-radius:22px;background:rgba(255,255,255,.88);padding:18px 20px;box-shadow:0 8px 20px rgba(16,24,40,.05)}
.time{font-size:36px;letter-spacing:-.08em;color:#667186}
.info strong{display:block;font-size:20px;line-height:1.08}
.info span{display:block;margin-top:7px;color:#5e6877;font-size:13px;line-height:1.35}
.result{display:inline-flex;align-items:center;min-height:32px;border-radius:999px;border:1px solid #ccefdc;background:#effaf4;color:#137947;padding:0 12px;font-size:12px;font-weight:1000}
.empty{padding:42px;text-align:center;border:1px dashed #cdd5df;border-radius:22px;background:rgba(255,255,255,.72);color:#697386}
@media(max-width:760px){.wrap{padding:18px}.top{display:grid}.controls{justify-content:space-between}.resultCard{grid-template-columns:1fr}.time{font-size:30px}.titleBox h2{font-size:23px}}

.pickupWrap{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pickupBtn{
  min-height:34px;
  border:1px solid #d8dee7;
  border-radius:999px;
  background:#171c26;
  color:#fff;
  padding:0 13px;
  font-size:11px;
  font-weight:1000;
  cursor:pointer;
  text-transform:uppercase;
}
.pickupBtn.done{
  background:#effaf4;
  color:#137947;
  border-color:#ccefdc;
}
.pickupHint{
  color:#7a8493;
  font-size:8px;
  font-weight:1000;
  letter-spacing:.04em;
  text-align:right;
}
.resultNames{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.resultNameTag{
  border:1px solid #dfe5ec;
  border-radius:999px;
  background:#fff;
  color:#171c26;
  padding:5px 8px;
  font-size:11px;
  font-weight:1000;
}


.expiredStamp{
  min-height:42px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid #ffd7a8;
  border-radius:14px;
  background:#fff7ec;
  color:#8a4b00;
  padding:7px 11px;
  font-size:10px;
  font-weight:1000;
  line-height:1.25;
  text-align:center;
  max-width:190px;
}


/* AJUSTE FINAL — ESCALA COMPACTA E RESPONSIVA */
.wrap{padding:14px!important}.logoBar{max-width:500px!important;padding:8px 14px!important;margin-bottom:14px!important;border-radius:18px!important}.logoBar img{max-height:50px!important;max-width:420px!important}.head,.top{padding:12px 14px!important;margin-bottom:12px!important;border-radius:18px!important}.head h1,.brand h1,h1{font-size:21px!important}.controls{gap:8px!important;margin-bottom:12px!important}input,select,button,.control,.btn{min-height:34px!important;padding:7px 10px!important;border-radius:11px!important;font-size:11px!important}.panel{border-radius:20px!important;padding:13px!important;margin-bottom:12px!important}.panel h2{font-size:16px!important}.grid{gap:9px!important}.kpi{border-radius:15px!important;padding:11px!important}.kpi strong{font-size:24px!important}.item,.resultCard{gap:10px!important;padding:10px 12px!important;border-radius:15px!important}.time{font-size:22px!important}.info strong{font-size:12px!important}.info span{font-size:10px!important}.badge,.result{min-height:23px!important;font-size:9px!important;padding:0 8px!important}.titleBox,.descBox{border-radius:16px!important;padding:14px 18px!important}.titleBox h2{font-size:23px!important}.descBox p{font-size:13px!important}.body{padding:14px!important}.layout{gap:12px!important}.preview{padding:10px!important;border-radius:16px!important}.previewTitle{font-size:22px!important;padding:13px 15px!important}.previewDesc{font-size:14px!important;padding:13px 15px!important}.readHour span{min-height:25px!important;font-size:9px!important}.styleGrid{gap:6px!important;padding:7px!important}.table th,.table td{padding:8px!important;font-size:11px!important}@media(max-width:900px){.wrap{padding:10px!important}.layout,.grid{grid-template-columns:1fr!important}.logoBar img{max-width:320px!important}.head,.top{display:grid!important}}


/* === V23: RECEPÇÃO COM BOTÕES MAIS LEVES === */
.pickupBtn{
  background:linear-gradient(180deg,#1f6fab,#1767ad)!important;
  border-color:#8bc6ff!important;
  color:#fff!important;
  box-shadow:0 8px 18px rgba(23,103,173,.13)!important;
}
.pickupBtn:hover{
  background:linear-gradient(180deg,#2477bd,#155d9b)!important;
  transform:translateY(-1px);
}
.pickupBtn.done{
  background:#effaf4!important;
  color:#137947!important;
  border-color:#bde9ce!important;
  box-shadow:0 6px 14px rgba(19,121,71,.08)!important;
}
.expiredStamp{
  background:#fff7ec!important;
  border-color:#ffd59c!important;
  color:#9a5600!important;
}
.result{
  background:#effaf4!important;
  border-color:#bde9ce!important;
  color:#137947!important;
}


/* === V28: PRAZO DE RETIRADA — 5 DIAS ÚTEIS APÓS CONFIRMAÇÃO === */
.deadlineNote{
  display:inline-flex;
  align-items:center;
  min-height:24px;
  border-radius:999px;
  padding:0 9px;
  font-size:9px;
  font-weight:1000;
  letter-spacing:.045em;
  border:1px solid #dfe5ec;
  background:#f8fafc;
  color:#657084;
}
.deadlineNote.today{
  background:#fff1f3;
  border-color:#f3b5c0;
  color:#b61c32;
}
.deadlineNote.tomorrow{
  background:#fff7ec;
  border-color:#ffd7a8;
  color:#9a5600;
}
.deadlineNote.ok{
  background:#eef5ff;
  border-color:#cfe0ff;
  color:#2f69c9;
}
.resultNames{
  align-items:center;
}
.pickupBtn.expiringToday{
  background:linear-gradient(180deg,#c94456,#b61c32)!important;
  border-color:#f3b5c0!important;
}
.pickupBtn.expiringTomorrow{
  background:linear-gradient(180deg,#e58a22,#d27900)!important;
  border-color:#ffd7a8!important;
}
.expiredStamp{
  background:#fff1f3!important;
  border-color:#f3b5c0!important;
  color:#b61c32!important;
}


/* === V29: RECEPÇÃO OPERACIONAL — FILTROS, STATUS E GANHADOR EM DESTAQUE === */
.receptionHero{
  gap:8px!important;
  margin-bottom:10px!important;
}
.receptionHero .titleBox{
  min-height:58px!important;
}
.receptionHero .descBox{
  min-height:52px!important;
}
.receptionToolbar{
  display:grid;
  grid-template-columns:minmax(260px,1fr) 190px minmax(320px,auto);
  gap:10px;
  align-items:end;
  margin:0 0 12px;
  border:1px solid #dfe5ec;
  border-radius:18px;
  background:rgba(255,255,255,.82);
  padding:10px;
  box-shadow:0 8px 20px rgba(16,24,40,.04);
}
.filterField{display:grid;gap:5px;min-width:0}
.filterField label{font-size:8px;color:#657084;letter-spacing:.08em;font-weight:1000}
.filterField input,.filterField select{
  width:100%;
  min-height:35px!important;
  border:1px solid #dfe5ec;
  border-radius:12px!important;
  background:#fff;
  color:#171c26;
  padding:7px 10px!important;
  font-size:11px!important;
  font-weight:1000;
  text-transform:uppercase;
}
.receptionStats{
  display:flex;
  justify-content:flex-end;
  gap:6px;
  flex-wrap:wrap;
}
.statChip{
  min-height:28px;
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:0 9px;
  border:1px solid #dfe5ec;
  background:#f8fafc;
  color:#657084;
  font-size:8.5px;
  font-weight:1000;
  letter-spacing:.04em;
  white-space:nowrap;
}
.statChip strong{font-size:11px;color:#171c26;margin-left:5px}
.statChipBtn{cursor:pointer;font:inherit;text-transform:uppercase;transition:.15s ease}
.statChipBtn:hover,.statChipBtn:focus-visible{border-color:#d8a5b2;background:#fff5f7;color:#9f2340;outline:none}
.dateTimeBlock{display:grid;gap:4px;flex:0 0 84px;align-content:center}
.resultDate{display:block;font-size:8px;font-weight:1000;letter-spacing:.04em;color:#657084;white-space:nowrap}
.resultCard{
  grid-template-columns:80px minmax(0,1fr) auto!important;
  align-items:center!important;
  background:rgba(255,255,255,.92)!important;
  border-color:#dfe5ec!important;
  box-shadow:0 8px 18px rgba(16,24,40,.045)!important;
}
.resultCard.status-retirado{border-color:#bde9ce!important;background:linear-gradient(90deg,rgba(239,250,244,.82),rgba(255,255,255,.94))!important}
.resultCard.status-vencido{border-color:#f3b5c0!important;background:linear-gradient(90deg,rgba(255,241,243,.86),rgba(255,255,255,.94))!important}
.resultCard.status-vence-hoje{border-color:#f3b5c0!important;background:linear-gradient(90deg,rgba(255,245,247,.92),rgba(255,255,255,.94))!important}
.resultCard.status-vence-amanha{border-color:#ffd7a8!important;background:linear-gradient(90deg,rgba(255,247,236,.92),rgba(255,255,255,.94))!important}
.time{
  color:#5f6b7d!important;
  font-size:24px!important;
  font-weight:1000!important;
  letter-spacing:-.07em!important;
}
.info strong{
  font-size:14px!important;
  letter-spacing:-.02em;
  margin-bottom:3px;
}
.info span{font-size:10px!important}
.winnerBlock{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  margin-top:8px;
}
.winnerLabel{
  color:#657084;
  font-size:8px;
  letter-spacing:.08em;
  font-weight:1000;
}
.resultNameTag{
  background:#fff!important;
  border-color:#d8e0ea!important;
  color:#171c26!important;
  font-size:12px!important;
  min-height:28px;
  padding:0 11px!important;
}
.deadlineNote{
  min-height:27px!important;
  font-size:9px!important;
  padding:0 10px!important;
}
.pickupWrap{align-items:flex-end!important;min-width:190px}
.pickupStatus{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:31px;
  border-radius:999px;
  padding:0 11px;
  font-size:9.5px;
  font-weight:1000;
  letter-spacing:.04em;
  white-space:nowrap;
}
.pickupStatus.done{background:#effaf4;border:1px solid #bde9ce;color:#137947}
.pickupBtn{
  min-height:32px!important;
  border-radius:999px!important;
  padding:0 12px!important;
  font-size:10px!important;
}
.undoPickupBtn{
  min-height:22px!important;
  border:1px solid #dfe5ec;
  border-radius:999px!important;
  background:#f8fafc;
  color:#657084;
  padding:0 8px!important;
  font-size:7.5px!important;
  font-weight:1000;
  letter-spacing:.05em;
  cursor:pointer;
}
.undoPickupBtn:hover{background:#fff;border-color:#cfd8e4;color:#171c26}
.pickupHint{display:none!important}
.empty{padding:28px!important}
@media(max-width:900px){
  .receptionToolbar{grid-template-columns:1fr!important}
  .receptionStats{justify-content:flex-start}
  .resultCard{grid-template-columns:1fr!important}
  .pickupWrap{align-items:flex-start!important;min-width:0}
}


/* === V30: CARD DA RECEPÇÃO COM HORA À ESQUERDA, GANHADOR CENTRAL E STATUS À DIREITA === */
.resultCard{
  grid-template-columns:minmax(310px,.95fr) minmax(260px,1fr) minmax(220px,auto)!important;
  gap:18px!important;
  align-items:center!important;
  min-height:82px!important;
  padding:12px 16px!important;
}
.resultLeft{
  display:flex;
  align-items:center;
  gap:18px;
  min-width:0;
}
.resultLeft .time{
  flex:0 0 auto;
  text-align:left;
  font-size:34px!important;
  line-height:1!important;
  letter-spacing:-.075em!important;
  font-weight:1000!important;
  color:#a9475b!important;
  text-shadow:0 1px 0 rgba(255,255,255,.75);
}
.prizeText{
  min-width:0;
  display:grid;
  gap:5px;
}
.prizeText strong{
  display:block;
  font-size:13.5px!important;
  line-height:1.15!important;
  color:#171c26!important;
  letter-spacing:-.02em;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.prizeText span{
  display:block;
  margin:0!important;
  font-size:9.5px!important;
  line-height:1.25!important;
  color:#5f6a7a!important;
  letter-spacing:.035em;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.winnerCenter{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-width:0;
  flex-wrap:wrap;
  text-align:center;
  flex-direction:column;
}
.winnerCenter .resultNameTag{
  min-height:auto!important;
  padding:0!important;
  font-size:16px!important;
  font-weight:900!important;
  line-height:1.15!important;
  border-radius:0!important;
  background:transparent!important;
  border:none!important;
  color:#171c26!important;
  box-shadow:none!important;
  text-align:center!important;
}
.winnerCenter .deadlineNote{
  min-height:29px!important;
  padding:0 12px!important;
  align-self:center!important;
}
.resultRight{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  min-width:220px;
}
.resultRight .pickupWrap{
  align-items:flex-end!important;
  min-width:0!important;
}
.resultRight .pickupStatus{
  min-height:30px!important;
  font-size:9px!important;
}
.resultRight .undoPickupBtn{
  margin-top:4px;
}
.resultCard.status-retirado{
  background:linear-gradient(90deg,rgba(255,255,255,.96),rgba(239,250,244,.64))!important;
}
.resultCard.status-vencido{
  background:linear-gradient(90deg,rgba(255,255,255,.96),rgba(255,241,243,.70))!important;
}
.resultCard.status-vence-hoje{
  background:linear-gradient(90deg,rgba(255,255,255,.96),rgba(255,245,247,.72))!important;
}
.resultCard.status-vence-amanha{
  background:linear-gradient(90deg,rgba(255,255,255,.96),rgba(255,247,236,.72))!important;
}
@media(max-width:900px){
  .resultCard{
    grid-template-columns:1fr!important;
    gap:12px!important;
  }
  .resultLeft{
    width:100%;
  }
  .resultLeft .time{
    flex-basis:68px;
    font-size:30px!important;
  }
  .winnerCenter{
    justify-content:flex-start;
    text-align:left;
    align-items:flex-start;
  }
  .winnerCenter .resultNameTag,
  .winnerCenter .deadlineNote{
    align-self:flex-start!important;
    text-align:left!important;
  }
  .resultRight{
    justify-content:flex-start;
    min-width:0;
  }
  .resultRight .pickupWrap{
    align-items:flex-start!important;
  }
}


/* === V32: GANHADOR CENTRAL LIMPO + PRAZO NO BLOCO OPERACIONAL À DIREITA === */
.winnerCenter{
  flex-direction:row!important;
  align-items:center!important;
  justify-content:center!important;
  text-align:center!important;
}
.winnerCenter .resultNameTag{
  font-size:17px!important;
  font-weight:1000!important;
  letter-spacing:-.02em!important;
}
.resultRight{
  flex-direction:column!important;
  align-items:flex-end!important;
  justify-content:center!important;
  gap:5px!important;
}
.resultRight .deadlineNote{
  min-height:23px!important;
  padding:0 8px!important;
  font-size:8px!important;
  letter-spacing:.04em!important;
  max-width:230px!important;
  white-space:nowrap!important;
}
.resultRight .pickupWrap{
  align-items:flex-end!important;
  gap:4px!important;
}
.resultRight .pickupStatus{
  min-height:28px!important;
}
.resultRight .undoPickupBtn{
  min-height:20px!important;
  font-size:7px!important;
  padding:0 8px!important;
  margin-top:0!important;
}
@media(max-width:900px){
  .winnerCenter{
    justify-content:flex-start!important;
    text-align:left!important;
  }
  .resultRight{
    align-items:flex-start!important;
  }
}


/* === V33: AJUSTE FINO — CARD MAIS BAIXO, GANHADOR NO CENTRO REAL E BOTÕES MENORES === */
.resultCard{
  grid-template-columns:minmax(300px,1fr) minmax(220px,1fr) minmax(220px,1fr)!important;
  min-height:72px!important;
  padding:9px 14px!important;
  gap:14px!important;
}
.resultLeft{
  align-self:center!important;
}
.resultLeft .time{
  flex:0 0 72px!important;
  font-size:33px!important;
}
.winnerCenter{
  align-self:center!important;
  justify-self:center!important;
  width:100%!important;
  min-width:0!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  text-align:center!important;
}
.winnerCenter .resultNameTag{
  font-size:18px!important;
  line-height:1!important;
  transform:translateX(0)!important;
}
.resultRight{
  min-width:0!important;
  width:100%!important;
  justify-self:end!important;
  align-self:center!important;
  display:flex!important;
  align-items:flex-end!important;
  justify-content:center!important;
  gap:3px!important;
}
.resultRight .deadlineNote{
  min-height:20px!important;
  padding:0 7px!important;
  font-size:7.4px!important;
  max-width:200px!important;
}
.resultRight .pickupStatus{
  min-height:24px!important;
  padding:0 9px!important;
  font-size:8px!important;
  letter-spacing:.035em!important;
}
.resultRight .undoPickupBtn{
  min-height:18px!important;
  padding:0 7px!important;
  font-size:6.7px!important;
  line-height:1!important;
}
.resultRight .pickupBtn{
  min-height:26px!important;
  padding:0 10px!important;
  font-size:8.5px!important;
}
@media(max-width:900px){
  .resultCard{
    grid-template-columns:1fr!important;
    min-height:auto!important;
  }
  .winnerCenter{
    justify-content:flex-start!important;
    text-align:left!important;
  }
  .resultRight{
    align-items:flex-start!important;
    justify-content:flex-start!important;
  }
}


/* === V41: CABEÇALHO ÚNICO E COMPACTO DA RECEPÇÃO === */
.receptionUnifiedHeader{
  position:relative;
  display:grid;
  grid-template-columns:minmax(180px,.8fr) minmax(360px,1.45fr) minmax(300px,auto);
  align-items:center;
  gap:18px;
  min-height:88px;
  margin-bottom:12px;
  padding:13px 16px 13px 20px;
  border:1px solid rgba(223,229,236,.94);
  border-radius:22px;
  background:rgba(255,255,255,.84);
  box-shadow:0 10px 26px rgba(16,24,40,.045);
  backdrop-filter:blur(8px);
  overflow:hidden;
}
.receptionUnifiedHeader::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;

function normalizeWinnerList(list){
  if(!Array.isArray(list)) return [];

  const dt=new Date(dateValue);

  while(added<days){

    const dow=dt.getDay();

    promoWinnerOccurrences(p).filter(w=>w.occurrenceDate===date).forEach(w=>{
      const reg=registeredDateForPromo({...p,resultDate:w.occurrenceDate,drawDate:w.occurrenceDate,drawTime:w.occurrenceTime},w),deadline=deadlineInfo(reg,w.deliveredAt||'',days);
      promos.push({source:'promo',id:p.id,winnerIndex:w.winnerIndex,occurrenceKey:w.occurrenceKey||'',date,time:w.occurrenceTime||p.resultSlot||((p.drawTime||'').slice(0,5)||'--:--'),sort:`${date}T${w.occurrenceTime||(p.drawTime||'23:59').slice(0,5)}`,title:promoPrizeTitle(p),sub:upper(p.local||p.type||'PROMOÇÃO'),result:upper(w.name),deliveredAt:w.deliveredAt||'',deliveredAtLabel:w.deliveredAtLabel||'',deadlineLabel:deadline.label,deadlineClass:deadline.className,expired:!w.deliveredAt&&deadline.expired,deadlineDays:days});
    });
  });
  return [...items,...promos].sort((a,b)=>a.sort.localeCompare(b.sort)||a.title.localeCompare(b.title)||a.result.localeCompare(b.result));
}
function allResultRows(){
  const dates=new Set();
  Object.values(state.months||{}).forEach(m=>{
    (m.items||[]).forEach(i=>{if(i?.date) dates.add(i.date);});
    (m.promos||[]).forEach(p=>{
      promoWinnerOccurrences(p).forEach(w=>{if(w?.occurrenceDate) dates.add(w.occurrenceDate);});
    });
  });
  const rows=[];
  [...dates].sort().forEach(date=>rows.push(...resultRowsForDate(date)));
  return rows.sort((a,b)=>String(b.sort||'').localeCompare(String(a.sort||''))||String(a.result||'').localeCompare(String(b.result||'')));
}
function isPickupPending(row){
  return !row.deliveredAt && !row.expired;
}
function pickupPendingCount(rows){
  return rows.reduce((n,row)=>n+(isPickupPending(row)?1:0),0);
}
function pickupButton(row){
  if(row.expired) return `<div class="pickupWrap"><div class="expiredStamp">NÃO RETIRADO NO PRAZO<br>PRÊMIO VOLTOU À CIRCULAÇÃO</div></div>`;
  const done=!!row.deliveredAt;
  if(done){
    return `<div class="pickupWrap"><span class="pickupStatus done">RETIRADO ${esc(row.deliveredAtLabel||'')}</span><button class="undoPickupBtn" type="button" data-source="${esc(row.source)}" data-id="${esc(row.id)}" data-winner-index="${esc(row.winnerIndex)}" data-occurrence-key="${esc(row.occurrenceKey||'')}" data-date="${esc(row.date||'')}">CANCELAR RETIRADA</button></div>`;
  }
  const statusClass=row.deadlineClass==='today'?' expiringToday':(row.deadlineClass==='tomorrow'?' expiringTomorrow':'');
  return `<div class="pickupWrap"><button class="pickupBtn${statusClass}" data-source="${esc(row.source)}" data-id="${esc(row.id)}" data-winner-index="${esc(row.winnerIndex)}" data-occurrence-key="${esc(row.occurrenceKey||'')}" data-date="${esc(row.date||'')}">CONFIRMAR RETIRADA</button></div>`;
}
function setPickup(row,undo=false){
  selectMonthForDate(row.date||$('dateFilter').value||todayISO());
  const now=new Date();
  let changedRecord=null;
  if(row.source==='item'){
    const sourceItem=(monthData().items||[]).find(i=>i.id===row.id);
    if(!sourceItem) return;
    const item=JSON.parse(JSON.stringify(sourceItem));
    const names=(Array.isArray(item.winnerNames)&&item.winnerNames.length)
      ? item.winnerNames.map(upper).filter(Boolean)
      : String(item.winnerName||'').split(',').map(upper).filter(Boolean);
    const idx=Math.max(0,Number(row.winnerIndex)||0);
    item.winnerNames=names;
    item.winnerDeliveries=Array.isArray(item.winnerDeliveries)?item.winnerDeliveries:[];
    while(item.winnerDeliveries.length<names.length) item.winnerDeliveries.push({});
    if(undo){
      item.winnerDeliveries[idx]={};
    }else{
      item.winnerDeliveries[idx]={
        deliveredAt:now.toISOString(),
        deliveredAtLabel:now.toLocaleString('pt-BR'),
        deliveredBy:'RECEPCAO'
      };
    }
    if(names.length===1){
      const delivery=item.winnerDeliveries[0]||{};
      item.deliveredAt=delivery.deliveredAt||'';
      item.deliveredAtLabel=delivery.deliveredAtLabel||'';
      item.deliveredBy=delivery.deliveredBy||'';
    }
    changedRecord=item;
  }else if(row.source==='promo'){
    const sourcePromo=(monthData().promos||[]).find(p=>p.id===row.id);if(!sourcePromo)return;const promo=JSON.parse(JSON.stringify(sourcePromo));const idx=Number(row.winnerIndex);
    if(row.occurrenceKey){
      const winners=normalizeWinnerList(promo.resultWinnersByHour?.[row.occurrenceKey]||[]);if(!winners[idx])return;
      winners[idx]={...winners[idx],deliveredAt:undo?'':now.toISOString(),deliveredAtLabel:undo?'':now.toLocaleString('pt-BR'),deliveredBy:undo?'':'RECEPCAO'};
      promo.resultWinnersByHour||={};promo.resultWinnersByHour[row.occurrenceKey]=winners;promo.resultByHour||={};promo.resultByHour[row.occurrenceKey]=winners.map(w=>w.name).join(', ');
    }else{
      let winners=normalizeWinnerList(promo.resultWinners||[]);if(!winners[idx])return;winners[idx]={...winners[idx],deliveredAt:undo?'':now.toISOString(),deliveredAtLabel:undo?'':now.toLocaleString('pt-BR'),deliveredBy:undo?'':'RECEPCAO'};promo.resultWinners=winners;promo.resultName=winners.map(w=>w.name).join(', ');
    }
    changedRecord=promo;
  }
  if(!changedRecord) return;
  return saveReceptionRecord(row.source,changedRecord).then(()=>{localStorage.setItem('jp_programacao_brindes_distribuicao_v2',JSON.stringify(state));render();refreshOpenReceptionSheet();return true;}).catch(err=>{console.warn('PICKUP SAVE ERROR',err);showReceptionToast(`NÃO FOI POSSÍVEL REGISTRAR A RETIRADA. ${upper(err?.message||'O PRÊMIO CONTINUA PENDENTE.')}`,true);throw err;});
}
function rowStatus(row){
  if(row.deliveredAt) return 'RETIRADO';
  if(row.expired) return 'VENCIDO';
  if(row.deadlineClass==='today') return 'VENCE_HOJE';
  if(row.deadlineClass==='tomorrow') return 'VENCE_AMANHA';
  return 'PENDENTE';
}
function rowStatusClass(row){
  const st=rowStatus(row);
  return st==='RETIRADO'?'retirado':st==='VENCIDO'?'vencido':st==='VENCE_HOJE'?'vence-hoje':st==='VENCE_AMANHA'?'vence-amanha':'pendente';
}
function applyReceptionFilters(rows){
  const query=searchKey($('searchFilter')?.value||'');
  const status=upper($('statusFilter')?.value||'TODOS');
  return rows.filter(r=>{
    if(status && status!=='TODOS'){
      if(status==='PENDENTE'){
        if(!isPickupPending(r)) return false;
      }else if(rowStatus(r)!==status) return false;
    }
    if(query){
      const hay=searchKey(`${r.result||''} ${r.title||''} ${r.sub||''} ${r.date||''} ${formatBR(r.date||'')} ${r.time||''} ${r.deadlineLabel||''}`);
      if(!hay.includes(query)) return false;
    }
    return true;
  });
}
function renderReceptionStats(rows){
  const counts=rows.reduce((acc,r)=>{acc[rowStatus(r)]=(acc[rowStatus(r)]||0)+1;return acc;},{});
  const pending=pickupPendingCount(rows);
  const total=rows.length;
  const html=`<button class="statChip statChipBtn" type="button" data-reception-stat="TODOS">TOTAL <strong>${total}</strong></button><button class="statChip statChipBtn" type="button" data-reception-stat="PENDENTE">PENDENTES <strong>${pending}</strong></button><button class="statChip statChipBtn" type="button" data-reception-stat="RETIRADO">RETIRADOS <strong>${counts.RETIRADO||0}</strong></button><button class="statChip statChipBtn" type="button" data-reception-stat="VENCE_HOJE">VENCE HOJE <strong>${counts.VENCE_HOJE||0}</strong></button><button class="statChip statChipBtn" type="button" data-reception-stat="VENCIDO">VENCIDOS <strong>${counts.VENCIDO||0}</strong></button>`;
  const box=$('receptionStats'); if(box) box.innerHTML=html;
}


function rowFromButton(btn){
  return {source:btn.dataset.source,id:btn.dataset.id,winnerIndex:btn.dataset.winnerIndex,occurrenceKey:btn.dataset.occurrenceKey||'',date:btn.dataset.date||''};
}
let activeReceptionRow=null; let pickupBusy=false;
function findReceptionRow(ref){return allResultRows().find(r=>r.source===ref.source&&String(r.id)===String(ref.id)&&String(r.winnerIndex)===String(ref.winnerIndex)&&String(r.occurrenceKey||'')===String(ref.occurrenceKey||'')&&String(r.date||'')===String(ref.date||''));}
function deadlineStatusText(row){if(row.deliveredAt)return `RETIRADO · ${row.deliveredAtLabel||''}`;if(row.expired)return `VENCIDO · ${row.deadlineLabel||''}`;if(row.deadlineClass==='today')return `VENCE HOJE · ${row.deadlineLabel||''}`;if(row.deadlineClass==='tomorrow')return `VENCE AMANHÃ · ${row.deadlineLabel||''}`;return row.deadlineLabel||'NO PRAZO';}
function openReceptionSheet(row){
  activeReceptionRow={source:row.source,id:row.id,winnerIndex:row.winnerIndex,occurrenceKey:row.occurrenceKey||'',date:row.date||''};
  const status=rowStatus(row), statusClass=status==='RETIRADO'?'done':status==='VENCIDO'?'expired':status==='VENCE_HOJE'?'today':'pending';
  const action=row.deliveredAt?`<button class="pickupSheetAction" type="button" disabled>RETIRADA JÁ REGISTRADA</button>`:row.expired?'':`<button class="pickupSheetAction" id="sheetConfirmPickup" type="button">CONFIRMAR RETIRADA</button>`;
  $('receptionModalBody').innerHTML=`<h3 class="pickupSheetName" id="receptionModalName">${esc(row.result)}</h3><div class="pickupSheetGrid"><div class="pickupSheetField"><span>PRÊMIO</span><strong>${esc(row.title)}</strong></div><div class="pickupSheetField"><span>GANHOU EM</span><strong>${esc(formatBR(row.date))} · ${esc(row.time)} · ${esc(row.sub)}</strong></div><div class="pickupSheetField"><span>PRAZO PARA RETIRADA</span><strong>${esc(row.deadlineLabel||'--')}</strong></div></div><div class="pickupSheetStatus ${statusClass}">${esc(deadlineStatusText(row))}</div>${action}`;
  $('receptionModal').hidden=false;
}
function closeReceptionSheet(){if(pickupBusy)return;$('receptionModal').hidden=true;activeReceptionRow=null;}
function showReceptionToast(message,error=false){const t=$('receptionToast');t.textContent=message;t.classList.toggle('error',error);t.hidden=false;clearTimeout(showReceptionToast.timer);showReceptionToast.timer=setTimeout(()=>{t.hidden=true;},error?4500:3000);}
function refreshOpenReceptionSheet(){if(!activeReceptionRow||$('receptionModal').hidden)return;const row=findReceptionRow(activeReceptionRow);if(row)openReceptionSheet(row);}
function render(){
  const date=$('dateFilter').value||todayISO();
  const query=upper($('searchFilter')?.value||'');
  const status=upper($('statusFilter')?.value||'TODOS');
  const allRows=allResultRows();
  const useGlobal=query || (status && status!=='TODOS');
  const sourceRows=useGlobal?allRows:resultRowsForDate(date);
  const filtered=applyReceptionFilters(sourceRows);
  renderReceptionStats(allRows);
  $('resultList').innerHTML=filtered.length?filtered.map(r=>{
    const deadline = r.deadlineLabel ? `<span class="deadlineNote ${esc(r.deadlineClass||'')}">${esc(r.deadlineLabel)}</span>` : '';
    return `<article class="resultCard status-${esc(rowStatusClass(r))}" tabindex="0" data-source="${esc(r.source)}" data-id="${esc(r.id)}" data-winner-index="${esc(r.winnerIndex)}" data-occurrence-key="${esc(r.occurrenceKey||'')}" data-date="${esc(r.date||'')}">
      <div class="resultLeft">
        <div class="dateTimeBlock"><span class="resultDate">${esc(formatBR(r.date||''))}</span><div class="time">${esc(r.time)}</div></div>
        <div class="prizeText"><strong>${esc(r.title)}</strong><span>${esc(r.sub)}</span></div>
      </div>
      <div class="winnerCenter"><span class="resultNameTag">${esc(r.result)}</span></div>
      <div class="resultRight">${deadline}${pickupButton(r)}</div>
    </article>`;
  }).join(''):'<div class="empty">NENHUM RESULTADO ENCONTRADO PARA ESTE FILTRO.</div>';
}
document.addEventListener('click',e=>{
  const stat=e.target.closest('[data-reception-stat]');
  if(stat){$('statusFilter').value=stat.dataset.receptionStat||'TODOS';$('searchFilter').value='';render();return;}
  if(e.target.closest('#receptionModalClose')){closeReceptionSheet();return;}
  if(e.target.id==='sheetConfirmPickup'){
    if(!activeReceptionRow||pickupBusy)return; const row=findReceptionRow(activeReceptionRow); if(!row)return;
    if(!confirm(`CONFIRMAR ENTREGA DE “${row.title}” PARA ${row.result}?`))return;
    const b=e.target;pickupBusy=true;b.disabled=true;b.textContent='REGISTRANDO...';
    setPickup(row,false).then(()=>{pickupBusy=false;const fresh=findReceptionRow(activeReceptionRow)||row;openReceptionSheet(fresh);showReceptionToast(`RETIRADA CONFIRMADA ✓ · ${fresh.result} · ${fresh.title}`);}).catch(()=>{pickupBusy=false;b.disabled=false;b.textContent='CONFIRMAR RETIRADA';});return;
  }
  const undo=e.target.closest('.undoPickupBtn');
  if(undo){const row=rowFromButton(undo);if(confirm('CANCELAR A CONFIRMAÇÃO DE RETIRADA?')) setPickup(row,true);return;}
  const card=e.target.closest('.resultCard');
  if(card){const row=findReceptionRow(rowFromButton(card));if(row)openReceptionSheet(row);return;}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.resultCard')){e.preventDefault();const row=findReceptionRow(rowFromButton(e.target));if(row)openReceptionSheet(row);}if(e.key==='Escape')closeReceptionSheet();});
$('receptionModal').addEventListener('click',e=>{if(e.target===$('receptionModal'))closeReceptionSheet();});
document.addEventListener('contextmenu',e=>{
  const btn=e.target.closest('.pickupBtn');
  if(!btn) return;
  e.preventDefault();
  if(!btn.classList.contains('done')) return;
  const row=rowFromButton(btn);
  if(confirm('CANCELAR A CONFIRMAÇÃO DE RETIRADA?')) setPickup(row,true);
});

$('dateFilter').value=todayISO();
$('dateFilter').addEventListener('change',render);
let searchTimer=null;$('searchFilter').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(render,90);});
$('statusFilter').addEventListener('change',render);
setInterval(render,60000);
firebaseRef.on('value',snap=>{const payload=snap.val();const remote=payload?.months?payload:(payload?.state?.months?payload.state:null);if(remote){state=remote;selectMonthForDate($('dateFilter').value);render();refreshOpenReceptionSheet();$('updated').textContent='ATUALIZADO: '+new Date().toLocaleString('pt-BR');}});
</script>
</body>
</html>
